pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,ts,jsx,tsx,json,md,css}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    tsc:
      glob: "*.{ts,tsx}"
      run: bunx tsc --noEmit

pre-push:
  commands:
    deploy:
      run: bun run build && vc --prod --no-wait
