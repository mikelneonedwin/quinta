<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      :root {
        --bg-color: #0a2540;
        --text-color: #fdfbf7;
        --accent-color: #38bdf8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --text-color: #f9fafb;
          --accent-color: #60a5fa;
        }
      }
      .bg {
        fill: var(--bg-color);
        rx: 7px;
      }
      .monogram {
        font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: var(--text-color);
        dominant-baseline: central;
        text-anchor: middle;
      }
      .dot {
        fill: var(--accent-color);
      }
    </style>
  </defs>
  <rect class="bg" width="32" height="32" />
  <text class="monogram" x="16" y="16.5">QA</text>
</svg>
